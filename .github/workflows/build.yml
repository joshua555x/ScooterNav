name: Build ScooterNav IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: xcodegen generate
      - name: Build Unsigned IPA
        run: |
          xcodebuild -project ScooterNav.xcodeproj \
            -scheme ScooterNav \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ScooterNav.xcarchive \
            archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -r build/ScooterNav.xcarchive/Products/Applications/ScooterNav.app build/Payload/
          cd build && zip -r ../ScooterNav.ipa Payload
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScooterNav-ipa
          path: ScooterNav.ipa
